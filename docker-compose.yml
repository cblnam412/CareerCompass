services:
  mongo:
    image: mongo:7
    container_name: doan1-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: doan1-auth-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URL: mongodb://mongo:27017/auth-service
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
      SUPABASE_KEY: ${SUPABASE_KEY:-doan1-dev-supabase-key}
    volumes:
      - ./backend/auth-service:/app
      - auth-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  university-service:
    build:
      context: ./backend/university-service
    container_name: doan1-university-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: development
      MONGO_URL: mongodb://mongo:27017/university-service
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
    volumes:
      - ./backend/university-service:/app
      - university-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: doan1-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:5000
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      LOG_LEVEL: info
      REQUEST_TIMEOUT: 30000
    volumes:
      - ./backend/api-gateway:/app
      - gateway-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: doan1-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongo-data:
  auth-node-modules:
  gateway-node-modules:
  university-node-modules:
  frontend-node-modules:
