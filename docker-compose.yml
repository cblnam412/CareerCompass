services:
  redis:
    image: redis:7-alpine
    container_name: doan1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: doan1-auth-service
    restart: unless-stopped
    env_file:
      - ./backend/auth-service/.env
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/auth-service:/app
      - auth-node-modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  university-service:
    build:
      context: ./backend/university-service
    container_name: doan1-university-service
    restart: unless-stopped
    env_file:
      - ./backend/university-service/.env
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:5000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/university-service:/app
      - university-node-modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mock-exams-service:
    build:
      context: ./backend/mock-exams-service
    container_name: doan1-mock-exams-service
    restart: unless-stopped
    env_file:
      - ./backend/mock-exams-service/.env
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:5000
      STUDENT_SERVICE_URL: http://student-service:5003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/mock-exams-service:/app
      - mock-exams-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  student-service:
    build:
      context: ./backend/student-service
    container_name: doan1-student-service
    restart: unless-stopped
    env_file:
      - ./backend/student-service/.env
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:5000
      MOCK_EXAMS_SERVICE_URL: http://mock-exams-service:5002
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/student-service:/app
      - student-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
      mock-exams-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  content-service:
    build:
      context: ./backend/content-service
    container_name: doan1-content-service
    restart: unless-stopped
    env_file:
      - ./backend/content-service/.env
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:5000
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/content-service:/app
      - content-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  messaging-service:
    build:
      context: ./backend/messaging-service
    container_name: doan1-messaging-service
    restart: unless-stopped
    env_file:
      - ./backend/messaging-service/.env
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:5000
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      STUDENT_SERVICE_URL: http://student-service:5003
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:5007
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_CONTEXT_MAX_CHARS: ${AI_CONTEXT_MAX_CHARS:-6000}
    volumes:
      - ./backend/messaging-service:/app
      - messaging-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  assessment-service:
    build:
      context: ./backend/assessment-service
    container_name: doan1-assessment-service
    restart: unless-stopped
    env_file:
      - ./backend/assessment-service/.env
    ports:
      - "5006:5006"
    environment:
      PORT: 5006
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      STUDENT_SERVICE_URL: http://student-service:5003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
    volumes:
      - ./backend/assessment-service:/app
      - assessment-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommendation-service:
    build:
      context: ./backend/recommendation-service
    container_name: doan1-recommendation-service
    restart: unless-stopped
    env_file:
      - ./backend/recommendation-service/.env
    ports:
      - "5017:5007"
    environment:
      PORT: 5007
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-doan1-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
      AUTO_SEED_RECOMMENDATION_DATA: "true"
    volumes:
      - ./backend/recommendation-service:/app
      - recommendation-node-modules:/app/node_modules
    depends_on:
      student-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
      mock-exams-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: doan1-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:5000
      UNIVERSITY_SERVICE_URL: http://university-service:5001
      MOCK_EXAMS_SERVICE_URL: http://mock-exams-service:5002
      STUDENT_SERVICE_URL: http://student-service:5003
      CONTENT_SERVICE_URL: http://content-service:5004
      MESSAGING_SERVICE_URL: http://messaging-service:5005
      ASSESSMENT_SERVICE_URL: http://assessment-service:5006
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:5007
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RESPONSE_CACHE_ENABLED: ${RESPONSE_CACHE_ENABLED:-false}
      RESPONSE_CACHE_TTL_SECONDS: ${RESPONSE_CACHE_TTL_SECONDS:-60}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-doan1-dev-internal-token}
      LOG_LEVEL: info
      MONITORING_MEMORY_LOG_LIMIT: 200
      SLOW_REQUEST_THRESHOLD_MS: 5000
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-300000}
      REQUEST_TIMEOUT: 30000
    volumes:
      - ./backend/api-gateway:/app
      - gateway-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_healthy
      university-service:
        condition: service_healthy
      mock-exams-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: doan1-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  redis-data:
  auth-node-modules:
  gateway-node-modules:
  university-node-modules:
  mock-exams-node-modules:
  student-node-modules:
  content-node-modules:
  messaging-node-modules:
  assessment-node-modules:
  recommendation-node-modules:
  frontend-node-modules:
